name: iOS

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ipa:
    name: Build, test, and unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Choose an iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          python3 - << 'PY' > simulator-udid.txt
          import json, re, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)

          def runtime_version(key):
              match = re.search(r"iOS-(\d+)-(\d+)", key)
              if not match:
                  return (0, 0)
              return (int(match.group(1)), int(match.group(2)))

          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      candidates.append((runtime_version(runtime), runtime, name, device["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulator runtime")
          candidates.sort(key=lambda item: (item[0], item[2]), reverse=True)
          latest = candidates[0][0]
          same = [item for item in candidates if item[0] == latest]
          plain = [
              item for item in same
              if all(token not in item[2] for token in ("Pro", "Plus", "SE", "mini", "Air", "Max"))
          ]
          chosen = (plain or same)[0]
          print(f"Picked {chosen[2]} on {chosen[1]}", file=sys.stderr)
          print(chosen[3])
          PY
          UDID="$(cat simulator-udid.txt)"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          echo "Using simulator ${UDID}"

      - name: Build and test on the simulator
        id: test
        run: |
          set -euo pipefail
          rm -rf TestResults.xcresult
          xcodebuild test \
            -project BikeGuard.xcodeproj \
            -scheme BikeGuard \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$PWD/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee xcodebuild-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 30

      - name: Archive unsigned app for generic iOS device
        run: |
          set -euo pipefail
          rm -rf build Payload BikeGuard-unsigned.ipa
          xcodebuild archive \
            -project BikeGuard.xcodeproj \
            -scheme BikeGuard \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$PWD/build/BikeGuard.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          APP="build/BikeGuard.xcarchive/Products/Applications/BikeGuard.app"
          test -d "$APP"
          test -x "$APP/BikeGuard"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y BikeGuard-unsigned.ipa Payload
          unzip -l BikeGuard-unsigned.ipa | head -n 40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: BikeGuard-unsigned-ipa
          path: BikeGuard-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summarize
        if: always()
        run: |
          {
            echo "## BikeGuard CI"
            echo
            echo "- Runner: macos-26"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Simulator: ${{ steps.simulator.outputs.udid }}"
            if [ -f BikeGuard-unsigned.ipa ]; then
              echo "- IPA: BikeGuard-unsigned.ipa ($(wc -c < BikeGuard-unsigned.ipa) bytes)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
